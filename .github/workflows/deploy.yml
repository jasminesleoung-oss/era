name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate config.js from secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_EMAIL: ${{ secrets.SUPABASE_EMAIL }}
          SUPABASE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
          USDA_API_KEY: ${{ secrets.USDA_API_KEY }}
        run: |
          cat > js/config.js <<EOF
          var ERA_CONFIG = {
            supabaseUrl: '$SUPABASE_URL',
            supabaseAnonKey: '$SUPABASE_ANON_KEY',
            supabaseEmail: '$SUPABASE_EMAIL',
            supabasePassword: '$SUPABASE_PASSWORD',
            usdaApiKey: '$USDA_API_KEY'
          };
          EOF
      - name: Prepare deploy folder (exclude git/workflow internals)
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' ./ _site/
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
